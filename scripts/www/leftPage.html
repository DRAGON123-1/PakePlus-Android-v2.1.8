<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
        font-family: "dengkang-font";
        src: url("./MEllePRC-Medium.otf") format("otf");
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        height: 100vh;
        position: relative;
        background: url("./images/leftPage/bg.jpg") no-repeat;
        background-size: cover;
        font-family: "dengkang-font";
      }
      .menus {
        display: flex;
        align-items: center;
        justify-content: center;
        column-gap: 2.39rem;
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
      }
      .menus .mitem {
        width: 2.96rem;
        height: 2.95rem;
        background: url("./images/leftPage/mitemBg.png") no-repeat;
        background-size: 100% 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.56rem;
        color: #58c1d9;
      }
      .btns {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        column-gap: 0.2rem;
      }
      .btns .label {
        font-size: 0.62rem;
        color: #58c1d9;
      }
      .btns .btn {
        width: 1.63rem;
        height: 0.72rem;
        border-radius: 0.36rem;
        font-size: 0.62rem;
        color: #fff;
        text-align: center;
        line-height: 0.72rem;
      }
      .btns .btn.confirm {
        background-color: #4eacc9;
      }
      .btns .btn.cancel {
        background-color: #b6b6b6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="menus">
        <div class="mitem">香精</div>
        <div class="mitem">粉料</div>
        <div class="mitem">胶体</div>
      </div>
      <div class="btns">
        <div class="label">是否确认制膏</div>
        <div class="btn confirm">YES</div>
        <div class="btn cancel">NO</div>
      </div>
    </div>

    <script src="./rem.js"></script>
  </body>
</html>
